<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Request</title>
  <link rel="stylesheet" href="ch9lab.css">
</head>
<body>

  <h1>Request Your Trip</h1>

  <!-- Replace YOUR_FORM_ID with the endpoint from your free form service -->
  <form id="request" method="post" action="https://formspree.io/f/YOUR_FORM_ID">

    <!-- Hidden field: subject line for the service's notification e-mail -->
    <input type="hidden" name="_subject" value="New Trip Request">

    <p>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required>
    </p>

    <p>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="blog">Your travel blog (optional):</label>
      <input type="url" id="blog" name="blog" placeholder="https://">
    </p>

    <p>
      <label for="travelers">Number of travelers:</label>
      <input type="number" id="travelers" name="travelers" min="1" max="12" value="2">
    </p>

    <p>
      <label for="departure">Departure date:</label>
      <input type="date" id="departure" name="departure" min="2026-12-01">
    </p>

    <p>
      <label for="budget">Budget ($500 to $5,000):</label>
      <input type="range" id="budget" name="budget" min="500" max="5000" step="100" value="2500">
    </p>

    <p>
      <label for="trip-color">Pick a color for your trip folder:</label>
      <input type="color" id="trip-color" name="trip_color" value="#1a5fb4">
    </p>

    <p>
      <label for="city">Favorite city:</label>
      <input type="text" id="city" name="city" list="city-list">
      <datalist id="city-list">
        <option value="Paris"></option>
        <option value="Rome"></option>
        <option value="Tokyo"></option>
        <option value="Bangkok"></option>
        <option value="Sydney"></option>
      </datalist>
    </p>

    <p>
      <label for="zip">ZIP or postal code:</label>
      <input type="text" id="zip" name="zip"
             pattern="[0-9A-Za-z -]{3,10}"
             title="3 to 10 letters, digits, spaces, or hyphens (for example 37130 or SW1A 1AA)">
    </p>

    <p>
      <button type="submit">Send Request</button>
    </p>

  </form>

</body>
</html>
